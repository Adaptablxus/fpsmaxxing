name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric jar
        run: ./gradlew build --no-daemon

      - name: Build NeoForge jar
        run: ./gradlew -p neoforge-probe build --no-daemon

      - name: Prepare release jars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "build/libs/fpsmaxx-${VERSION}.jar" "FPSMaxx-${VERSION}-fabric-mc26.3.jar"
          cp "neoforge-probe/build/libs/fpsmaxx-neoforge-${VERSION}.jar" "FPSMaxx-${VERSION}-neoforge-mc26.3.jar"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          ## FPSMaxx ${VERSION}

          FPSMaxx is a **client-side optimization mod for Minecraft 26.3** with
          **Fabric** and **NeoForge** builds. It is built for smooth gameplay on
          low-end PCs while keeping high-end machines fast.

          ### Choose your jar

          - **Fabric 26.3:** \`FPSMaxx-${VERSION}-fabric-mc26.3.jar\`
          - **NeoForge 26.3:** \`FPSMaxx-${VERSION}-neoforge-mc26.3.jar\`
          - **Fabric 26.2:** use the previous \`1.4.1\` release.

          Fabric users also need **Fabric API 0.165.0+26.3** (or newer for 26.3).
          NeoForge users need **NeoForge 26.3.0.97+**. Java 25 is required.

          ### How it optimizes

          - **Hidden FpsMaxx preset** - drag the Graphics Preset slider all the way
            left. The FpsMaxx position applies the adaptive governor, all cull
            distances, the particle budget and the chunk-update budget together
            with the low-end graphics reductions.
          - **Low-end preset** - \`/fpsmaxx lowend\` applies Fast graphics, clouds
            off, cloud distance 2, minimal particles, render 16, simulation 8 and
            a 60 FPS target.
          - **Potato preset** - \`/fpsmaxx potato\` goes to render 8, simulation 5,
            tiny cull distances and a 24-section update budget.
          - **Adaptive chunk-section culling** - chunks stay loaded, but only the
            affordable visible radius is submitted to the renderer.
          - **Chunk-update budgeting** - caps mesh rebuilds per frame and re-queues
            the rest, smoothing stutter.
          - **Particle culling and budgeting** - rejects and removes distant
            particles, and shrinks the live cap when FPS falls.
          - **Sodium integration** - caps Sodium's terrain search distance and fog
            to the same radius without unloading chunks, and adds a searchable
            FPSMaxx page with an **Open FPSMaxx preset screen** button to Sodium's
            Video Settings.
          - **Fresh & Smooth aware** - auto-detects the pack and keeps its shaders,
            particles and animations with a visual-safe profile.
          - **Particle optimizer aware** - defers particle culling to AsyncParticles
            or Particle Core when installed.
          - **Entity and block-entity culling** - skips distant entities before
            extraction and submission.
          - **Memory guard** - prevents small heaps from loading more chunks than
            they can safely hold.
          - **Chunk retention** - visible mode avoids repeated load/unload stutter.

          ### Loader notes

          - **Fabric:** Sodium 0.9.2+ for 26.3 works. The jar also runs on Quilt.
          - **NeoForge:** use **Sodium NeoForge 0.9.3-beta.1+** for 26.3. Sodium
            NeoForge 0.9.2 has a broken \`LevelExtractor\` mixin on 26.3.
          - **PojavLauncher / MojoLauncher:** use the Fabric jar. NeoForge is not
            supported by most mobile launchers yet.

          It is a rendering optimization mod, not a mob-AI or server optimizer.
          Simulation distance 32 is CPU-heavy; low-end lowers it to 8 and potato
          lowers it to 5.

          **Full documentation:** https://github.com/Adaptablxus/fpsmaxxing
          **Modrinth:** https://modrinth.com/mod/fpsmaxx
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "FPSMaxx-${VERSION}-fabric-mc26.3.jar" \
            "FPSMaxx-${VERSION}-neoforge-mc26.3.jar" \
            --title "FPSMaxx ${VERSION}" \
            --notes-file release-notes.md

      # The Modrinth project is still under review, so this step is allowed to
      # fail without blocking the GitHub release. Once approved, remove
      # continue-on-error to make Modrinth publication mandatory.
      - name: Publish to Modrinth
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "MODRINTH_TOKEN is not configured; skipping Modrinth upload."
            exit 0
          fi
          bash scripts/publish-modrinth.sh

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew build --no-daemon
          cp "build/libs/fpsmaxx-${VERSION}.jar" "FPSMaxx-${VERSION}-mc26.2.jar"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "FPSMaxx-${VERSION}-mc26.2.jar" \
            --title "FPSMaxx ${VERSION}" \
            --notes "FPSMaxx ${VERSION}"

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "MODRINTH_TOKEN is not configured; skipping Modrinth upload."
            exit 0
          fi
          bash scripts/publish-modrinth.sh

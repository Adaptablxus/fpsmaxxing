name: Update Modrinth metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update project summary and body
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "MODRINTH_TOKEN is not configured." >&2
            exit 1
          fi
          bash scripts/update-modrinth-metadata.sh

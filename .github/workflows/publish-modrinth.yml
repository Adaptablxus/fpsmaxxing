name: Publish to Modrinth

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 1.5.7)"
        required: true
        default: "1.5.7"
  push:
    tags:
      - "modrinth-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${REF_NAME#modrinth-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release jars
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl --fail --location --retry 3 \
            --output "FPSMaxx-${VERSION}-fabric-mc26.3.jar" \
            "https://github.com/Adaptablxus/fpsmaxxing/releases/download/v${VERSION}/FPSMaxx-${VERSION}-fabric-mc26.3.jar"
          curl --fail --location --retry 3 \
            --output "FPSMaxx-${VERSION}-neoforge-mc26.3.jar" \
            "https://github.com/Adaptablxus/fpsmaxxing/releases/download/v${VERSION}/FPSMaxx-${VERSION}-neoforge-mc26.3.jar"

      - name: Publish versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "MODRINTH_TOKEN is not configured." >&2
            exit 1
          fi
          bash scripts/publish-modrinth.sh
